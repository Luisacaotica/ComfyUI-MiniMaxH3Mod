<style>body{background:#0d1218;color:#ddd;font:16px system-ui;padding:30px}button{font:inherit;padding:12px}</style>

 {name:"celebs/person",kind:"image",concept:"identity",description:"Portrait reference",tokens:1024,path:"models/refmods/celebs/person.safetensors"},
 {name:"voices/narrator",kind:"audio",concept:"voice",description:"Warm narrator",tokens:800,path:"models/refmods/voices/narrator.safetensors"},

document.querySelector("#open").onclick=()=>openRefModLibrary(node,async()=>data);
